server.port=0

# ===== 网关限流配置（按租户固定窗口）=====
# 每个窗口内每租户默认放行请求量
gateway.throttle.default-limit=10
# 窗口时长（毫秒）
gateway.throttle.window-millis=60000
# 指定租户的单独额度（key 为租户标识，value 为窗口内放行量）
gateway.throttle.tenant-limits.tier-premium=50

# ===== 网关响应时间上限 =====
# 全局默认响应时间上限（毫秒），后端超过该时限未返回即按超时结束
gateway.timeout.default-millis=2000
# 按路由单独覆盖（key 为路由名，value 为毫秒）
# gateway.timeout.route-overrides.echo=5000

# ===== 网关快速失败（熔断）配置 =====
# 同一租户在同一路由上连续超时达到该次数后进入保护期
gateway.circuit.failure-threshold=3
# 保护期时长（毫秒），期间请求快速失败，到期自动恢复
gateway.circuit.open-millis=30000
