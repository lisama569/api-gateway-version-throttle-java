server.port=0

# ===== 网关限流配置（按租户固定窗口）=====
# 每个窗口内每租户默认放行请求量
gateway.throttle.default-limit=10
# 窗口时长（毫秒）
gateway.throttle.window-millis=60000
# 指定租户的单独额度（key 为租户标识，value 为窗口内放行量）
gateway.throttle.tenant-limits.tier-premium=50

# ===== 后端响应时间上限 =====
# 全局默认响应时间上限（毫秒）：后端在此时间内不返回即判超时，归一化为 BACKEND_TIMEOUT
gateway.timeout.default-millis=3000
# 针对单个路由的覆盖值（key 为路由名）；未配置的路由回落到 default-millis
gateway.timeout.route-millis.echo=2000

# ===== 快速失败（租户 + 路由维度熔断）=====
# 同一租户在同一路由上连续超时达到该次数后，进入短暂快速失败保护期
gateway.circuit-breaker.failure-threshold=5
# 保护期时长（毫秒）：期间直接返回 CIRCUIT_OPEN 与 retryAfterMillis，不再打向后端；到期自动试探恢复
gateway.circuit-breaker.open-millis=5000
